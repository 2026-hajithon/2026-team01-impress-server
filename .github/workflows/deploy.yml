name: Spring Boot CD

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시되면 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test # 테스트 코드는 무시하고 빠르게 빌드

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/ubuntu/app"

      - name: Execute on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 8080 포트에서 실행 중인 서버 끄기
            sudo fuser -k -n tcp 8080 || true
            
            # application.properties 파일에 깃허브 Secrets 값을 직접 주입하기
            echo "spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver" > /home/ubuntu/app/src/main/resources/application.properties
            echo "spring.datasource.url=${{ secrets.DB_URL }}" >> /home/ubuntu/app/src/main/resources/application.properties
            echo "spring.datasource.username=${{ secrets.DB_USERNAME }}" >> /home/ubuntu/app/src/main/resources/application.properties
            echo "spring.datasource.password=${{ secrets.DB_PASSWORD }}" >> /home/ubuntu/app/src/main/resources/application.properties
            echo "spring.jpa.hibernate.ddl-auto=update" >> /home/ubuntu/app/src/main/resources/application.properties
            
            # 기존 로그 파일 삭제
            rm -f /home/ubuntu/nohup.out
            
            # 서버 실행
            nohup java -jar /home/ubuntu/app/build/libs/impress-server-0.0.1-SNAPSHOT.jar > /home/ubuntu/nohup.out 2>&1 &