name: Spring Boot CD

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시되면 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test # 테스트 코드는 무시하고 빠르게 빌드

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/ubuntu/app"

      - name: Execute on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 8080 포트에서 실행 중인 서버 끄기
            sudo fuser -k -n tcp 8080 || true
            
            # 새 코드 백그라운드에서 실행하기
            nohup java -jar /home/ubuntu/app/build/libs/*SNAPSHOT.jar > /home/ubuntu/nohup.out 2>&1 &